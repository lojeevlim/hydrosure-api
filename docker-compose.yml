name: hydrosure

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hydrosure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydrosure}
      POSTGRES_DB: ${POSTGRES_DB:-hydrosure}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hydrosure} -d $${POSTGRES_DB:-hydrosure}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hydrosure}:${POSTGRES_PASSWORD:-hydrosure}@db:5432/${POSTGRES_DB:-hydrosure}?schema=public
      # Required, no default on purpose: api refuses to start unless this is 32+ chars.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      STORE_NAME: ${STORE_NAME:-Lojee Store}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-PHP}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
